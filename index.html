<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>刘昊扬 | Personal Homepage</title>
  <meta name="description" content="Personal homepage of 刘昊扬. Research and technical interests, contact information, and GitHub.">
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Arial, sans-serif; color: #202c3d; background: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; font-size: 17px; line-height: 1.7; }
    main { max-width: 780px; margin: 0 auto; padding: 76px 28px 48px; }
    header { border-top: 4px solid #244e76; padding-top: 28px; margin-bottom: 42px; }
    h1 { margin: 0 0 22px; font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.25; font-weight: 650; letter-spacing: -.025em; overflow-wrap: anywhere; }
    h2 { margin: 0 0 16px; font-size: 1.2rem; line-height: 1.5; font-weight: 650; }
    dl { margin: 0; }
    dl div { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; margin: 8px 0; }
    dt { color: #546174; }
    dd { margin: 0; overflow-wrap: anywhere; }
    a { color: #205b91; text-decoration-thickness: 1px; text-underline-offset: 4px; }
    a:hover { color: #123d63; }
    a:focus-visible { outline: 2px solid #205b91; outline-offset: 5px; border-radius: 2px; }
    section { border-top: 1px solid #dce2e9; padding-top: 26px; }
    ul { padding-left: 22px; margin: 0; }
    li { padding-left: 3px; margin: 5px 0; }
    @media (max-width: 480px) { main { padding: 40px 22px; } dl div { grid-template-columns: 1fr; gap: 0; margin: 14px 0; } }
  </style>
</head>

  <main>
    <header>

      <dl>
        <div><dt>Email</dt><dd><a href="mailto:hy.liu@t2cn.com">hy.liu@t2cn.com</a></dd></div>
        <div><dt>GitHub</dt><dd><a href="https://github.com/l2228005377-web">github.com/l2228005377-web</a></dd></div>
      </dl>
    </header>
    <section aria-labelledby="interests">
      <h2 id="interests">Research / Technical Interests</h2>
      <ul>
        <li>Artificial Intelligence</li>
        <li>AI Agents</li>
        <li>AI-native Development</li>
        <li>Game Development</li>
      </ul>
    </section>
  </main>
</body>
